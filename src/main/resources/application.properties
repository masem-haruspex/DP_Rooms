spring.application.name=Rooms

# ===============================
# = SERVER CONFIGURATION
# ===============================

server.port=8082
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# ===============================
# = DATABASE CONFIGURATION
# ===============================

# PostgreSQL connection
spring.datasource.url=jdbc:postgresql://localhost:5432/dp_rooms

# PostgreSQL driver (optional, Spring Boot can auto-detect)
# spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# = JPA / HIBERNATE CONFIGURATION
# ===============================

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Hibernate ddl-auto options:
# create       - create schema at startup, drop at shutdown
# create-drop  - create schema at startup, drop at shutdown
# update       - update schema on startup (not recommended for production)
# validate     - validate schema, do not modify
# none         - do nothing

# Debugging SQL (uncomment when needed)
# spring.jpa.show-sql=true
# spring.jpa.properties.hibernate.format_sql=true

# ===============================
# = RSA KEY CONFIGURATION
# ===============================

spring.security.oauth2.resourceserver.jwt.public-key-location=classpath:certifications/public.pem

# ===============================
# = FILE UPLOAD CONFIGURATION
# ===============================

# spring.servlet.multipart.max-file-size=50MB
# spring.servlet.multipart.max-request-size=50MB

# ===============================
# = LOGGING CONFIGURATION
# ===============================

logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(${LOG_LEVEL_PATTERN:%5p}) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n${LOG_EXCEPTION_CONVERSION_WORD:%wEx}

# Default logging levels
logging.level.com.mm_mk.Rooms=ERROR
logging.level.org.springframework=ERROR
logging.level.org.springframework.security=ERROR
logging.level.org.hibernate=ERROR
logging.level.org.apache.tomcat=ERROR
logging.level.org.apache.catalina=ERROR

# Uncomment for debugging
# logging.level.org.springframework.security=TRACE
# logging.level.com.mm_mk.Rooms=DEBUG
# logging.level.org.springframework=DEBUG
# logging.level.org.apache.tomcat=DEBUG
# logging.level.org.apache.catalina=DEBUG
# logging.level.org.hibernate=INFO
# logging.level.org.hibernate.SQL=DEBUG
# logging.level.org.hibernate.orm.jdbc.bind=TRACE
# logging.level.org.hibernate.stat=DEBUG
# logging.level.org.hibernate.SQL_SLOW=INFO
# logging.level.org.hibernate.pretty=INFO
# logging.level.org.hibernate.cache=DEBUG
# logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
# logging.level.org.springframework.jdbc.core=TRACE

logging.path=/logs

# ===============================
# = SPRING DATA CONFIGURATION
# ===============================

spring.data.jdbc.repositories.enabled=false

# ===============================
# = RABBITMQ CONFIGURATION
# ===============================

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# RabbitMQ Exchanges and Routing Keys
rabbitmq.exchange.rooms=rooms.exchange
rabbitmq.routingkey.room.created=room.created
rabbitmq.routingkey.user.joined=user.joined
rabbitmq.routingkey.room.deleted=room.deleted
rabbitmq.routingkey.user.left=user.left
rabbitmq.routingkey.user.kicked=user.kicked
rabbitmq.routingkey.user.muted=user.muted

# RabbitMQ Queue Names
app.rabbitmq.queue=rooms.user.queue

# ===============================
# = ACTUATOR CONFIGURATION
# ===============================

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ===============================
# = LOAD LOCAL CONFIGURATIONS
# ===============================

spring.profiles.active=local
